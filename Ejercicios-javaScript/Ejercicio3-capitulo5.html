<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3_Capitulo5 </title>
    <script>
        var contador = 1;
    function añade(){
        var elemento = document.createElement("li");
        var texto = document.createTextNode(" Nuevo elemento de prueba " +contador);
        elemento.appendChild(texto);
        var lista = document.getElementById("lista");
        lista.appendChild(elemento);
        contador++;
    }
    </script>

</head>
<body>
    <ul id="lista">
        <li>Lorem ipsum dolor sit amet</li>
        <li>Consectetuer adipiscing elit</li>
        <li>Sed mattis enim vitae orci</li>
        <li>Phasellus libero</li>
        <li>Maecenas nisl arcu</li>
    </ul>

    <button onclick="añade();">Añadir elemento</button>

    
</body>
</html>
